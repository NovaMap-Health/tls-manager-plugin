# Publishes the TLS Manager plugin to GitHub Releases: the extension zip plus its
# .sha256 sidecar, on a semver tag.
#
#   git tag v1.0.7 && git push origin v1.0.7
#
# Uses the repo's own build.sh (which builds the engine plugin AND the web-ui WAR
# and bundles them into target/tls-manager-<hash>.zip); the workflow then renames
# that artifact to a version-matched release asset.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # required to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node (for the web-ui build in build.sh)
        uses: actions/setup-node@v7
        with:
          node-version-file: web-ui/.nvmrc

      - name: Resolve version from the tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # versions:set makes the tag the source of truth for the generated plugin.xml's
      # pluginVersion. build.sh's `mvn clean` does not revert the pom edit, so the set
      # version carries into the build.
      - name: Build plugin bundle
        run: |
          mvn -B -ntp versions:set -DnewVersion="${{ steps.ver.outputs.version }}" -DprocessAllModules=true -DgenerateBackupPoms=false
          ./build.sh

      - name: Stage the release asset and checksum
        id: pkg
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          SRC="$(find target -maxdepth 1 -name 'tls-manager-*.zip' | head -n1)"
          if [ -z "$SRC" ]; then
            echo "::error::No plugin zip found in target/"; ls -l target || true; exit 1
          fi
          ASSET="tls-manager-${VERSION}.zip"
          mkdir -p out
          cp "$SRC" "out/${ASSET}"
          ( cd out && sha256sum "${ASSET}" > "${ASSET}.sha256" )
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/${{ steps.pkg.outputs.asset }}
            out/${{ steps.pkg.outputs.asset }}.sha256
          # Tags like v1.0.7-rc1 publish as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
